<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09111f" />
  <title>Vela â€” Talking Character</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { color-scheme: dark; --ink:#ecf3ff; --muted:#8e9bb2; --panel:rgba(11,20,37,.84); --line:rgba(167,190,224,.15); --accent:#8af1d1; --accent2:#82a9ff; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#070d18; color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
    body { min-height:100dvh; overflow-x:hidden; }
    #avatar { position:fixed; inset:0; z-index:0; }
    #avatar::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(5,10,20,.25) 0%, transparent 24%, transparent 57%, rgba(5,10,20,.3) 100%); }
    .shell { position:relative; z-index:2; min-height:100dvh; display:flex; flex-direction:column; padding:clamp(14px,2.5vw,30px); pointer-events:none; }
    #avatar { filter:contrast(1.035) saturate(1.04); }
    #avatar canvas { width:100% !important; height:100% !important; }
    header, .panel { pointer-events:auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:36px; height:36px; display:grid; place-items:center; border:1px solid rgba(138,241,209,.5); border-radius:12px; color:var(--accent); background:rgba(138,241,209,.08); font-weight:700; }
    .brand strong { font-family:'Space Grotesk'; font-size:18px; letter-spacing:.02em; }
    .brand small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .status { display:flex; align-items:center; gap:9px; font-size:12px; color:#b9c5d7; background:rgba(10,19,34,.58); border:1px solid var(--line); padding:9px 12px; border-radius:999px; backdrop-filter:blur(12px); }
    .camera-tools { pointer-events:auto; position:fixed; z-index:3; right:16px; top:50%; transform:translateY(-50%); display:grid; gap:8px; }
    .camera-tools button { width:42px; height:42px; padding:0; border:1px solid var(--line); border-radius:50%; color:var(--ink); background:rgba(8,15,27,.72); box-shadow:none; backdrop-filter:blur(10px); font-size:18px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ffbe71; box-shadow:0 0 12px #ffbe71; }
    .dot.ready { background:var(--accent); box-shadow:0 0 12px var(--accent); }
    .content { width:min(100%, 900px); margin: auto auto 0; }
    .panel { width:100%; background:rgba(8,15,27,.86); border:1px solid var(--line); border-radius:18px; padding:12px; box-shadow:0 10px 44px rgba(0,0,0,.3); backdrop-filter:blur(16px); }
    .panel-top { display:none; }
    label { display:none; }
    textarea, select { width:100%; border:1px solid var(--line); color:var(--ink); background:rgba(5,13,26,.78); border-radius:14px; padding:13px 14px; font:inherit; outline:none; }
    textarea { min-height:48px; max-height:96px; resize:vertical; line-height:1.4; }
    textarea:focus, select:focus { border-color:rgba(138,241,209,.7); box-shadow:0 0 0 3px rgba(138,241,209,.08); }
    .row { display:grid; grid-template-columns:150px 150px 1fr; gap:8px; margin-top:8px; align-items:center; }
    .select-wrap select { appearance:none; }
    button { width:100%; margin-top:0; border:0; border-radius:12px; padding:12px 16px; color:#06131a; background:linear-gradient(135deg,var(--accent),#b1f8e5); font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 9px 24px rgba(138,241,209,.16); }
    button:disabled { opacity:.45; cursor:wait; }
    .progress { margin:5px 3px 0; color:var(--muted); font-size:11px; min-height:14px; }
    @media (max-width:600px) { .shell { padding:12px; padding-bottom:max(12px, env(safe-area-inset-bottom)); } .status { font-size:10px; padding:7px 9px; } .content { width:100%; margin:auto auto 0; } .panel { padding:10px; border-radius:16px; } textarea { min-height:52px; } .row { grid-template-columns:1fr 1fr 100px; gap:7px; margin-top:7px; } select { padding:10px 8px; font-size:13px; border-radius:11px; } button { padding:11px 8px; font-size:13px; border-radius:11px; } .progress { margin-top:4px; } }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186/examples/jsm/",
    "talkinghead": "./TalkingHead/modules/talkinghead.mjs",
    "headtts": "./HeadTTS/modules/headtts.mjs"
  } }
  </script>
</head>
<body>
  <div id="avatar" aria-label="3D talking character"></div>
  <main class="shell">
    <header>
      <div class="brand"><div class="mark">V</div><div><strong>VELA</strong><small>realtime character studio</small></div></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading avatarâ€¦</span></div>
    </header>
    <nav class="camera-tools" aria-label="Camera controls">
      <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out">âˆ’</button>
      <button type="button" id="panLeft" aria-label="Pan left" title="Pan left">â†</button>
      <button type="button" id="panRight" aria-label="Pan right" title="Pan right">â†’</button>
      <button type="button" id="resetCamera" aria-label="Reset camera" title="Reset camera">â†º</button>
    </nav>
    <section class="content">
      <form class="panel" id="talkForm">
        <div class="panel-top"><span class="panel-title">Give Vela a line</span><span class="inference" id="inferenceMode">RTX inference Â· connecting</span></div>
        <label for="text">Dialogue</label>
        <textarea id="text" maxlength="500">Every good idea starts as a conversation. Letâ€™s make this one memorable.</textarea>
        <div class="row">
          <div><label for="emotion">Emotion</label><select id="emotion"><option value="neutral">Neutral</option><option value="happy">Happy</option><option value="sad">Sad</option><option value="angry">Angry</option><option value="nervous">Nervous</option></select></div>
          <div><label for="voice">Voice</label><select id="voice"><option value="af_bella">Bella Â· warm</option><option value="am_fenrir">Fenrir Â· grounded</option></select></div>
        </div>
        <button id="speak" type="submit" disabled>Loading characterâ€¦</button>
        <div id="progress" class="progress" role="status"></div>
      </form>
    </section>
  </main>
  <script type="module">
    import { TalkingHead } from "talkinghead";
    import { HeadTTS } from "headtts";

    const $ = (id) => document.getElementById(id);
    const el = { avatar:$('avatar'), form:$('talkForm'), text:$('text'), emotion:$('emotion'), voice:$('voice'), speak:$('speak'), progress:$('progress'), statusDot:$('statusDot'), statusText:$('statusText'), inference:$('inferenceMode') };
    let head, headtts, ready = false, moodTimer;
    const moods = { neutral:'neutral', happy:'happy', sad:'sad', angry:'angry', nervous:'fear' };

    function setStatus(text, isReady=false) { el.statusText.textContent=text; el.statusDot.classList.toggle('ready', isReady); }
    function setMood(mood) { if (!head) return; head.setMood(moods[mood] || 'neutral'); clearTimeout(moodTimer); moodTimer=setTimeout(() => head.setMood('neutral'), 5200); }

    async function boot() {
      head = new TalkingHead(el.avatar, { ttsEndpoint:'N/A', lipsyncModules:[], cameraView:'head', mixerGainSpeech:3, cameraRotateEnable:true, cameraPanEnable:true, cameraZoomEnable:true, ambientLightColor:0x9fb8d6, ambientLightIntensity:1.5, cameraY:0.02, cameraRotateX:0, cameraRotateY:0 });
      headtts = new HeadTTS({
        // Prefer the RTX PC's local HeadTTS REST endpoint. The browser engines remain a fallback
        // for phones or when the desktop inference service is not running.
        endpoints: [`http://${location.hostname || '127.0.0.1'}:8882/v1`, 'webgpu', 'wasm'],
        languages:['en-us'], voices:['af_bella','am_fenrir'], voiceURL:'../voices', audioCtx:head.audioCtx,
        transformersModule:'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.0/dist/transformers.min.js',
        dictionaryURL:'../dictionaries', trace:0
      });
      headtts.onmessage = (message) => {
        if (message.type === 'audio') { head.speakMarker(() => {}); head.speakAudio(message.data, {}, (word) => { el.progress.textContent = word || 'Speakingâ€¦'; }); }
        else if (message.type === 'error') { el.progress.textContent = `TTS error: ${message.data?.error || 'unknown error'}`; el.speak.disabled=false; }
      };
      const info = { head:'', tts:'' };
      const progress = (name, ev) => { if (ev?.lengthComputable) info[name]=`${Math.round(ev.loaded/ev.total*100)}%`; else if (ev) info[name]=`${Math.round(ev.loaded/1000)} KB`; el.progress.textContent=`Loading ${info.head || 'avatar'} Â· ${info.tts || 'voice engine'}`; };
      await Promise.all([
        head.showAvatar({ url:'./TalkingHead/avatars/avaturn.glb', body:'F', avatarMood:'neutral', lipsyncLang:'en', retarget:{ Hips:{y:0.03}, Spine:{y:0.02}, Spine1:{y:0.02,z:0.01}, Spine2:{y:0.02,z:0.01}, Neck:{z:0.02,y:0.01}, Head:{z:0.02}, LeftShoulder:{rx:-0.5}, RightShoulder:{rx:-0.5}, scaleToHipsLevel:1.0 }, baseline:{ headRotateX:-0.05, eyeBlinkLeft:0.15, eyeBlinkRight:0.15 } }, progress.bind(null,'head')),
        headtts.connect(null, progress.bind(null,'tts'))
      ]);
      headtts.setup({ voice:el.voice.value, language:'en-us', speed:1, audioEncoding:'wav' });
      // TalkingHead defaults to a 10° portrait lens. Widen it for this avatar so
      // its eyes, cheeks and jaw remain in frame on tall phone screens.
      head.camera.fov = window.innerWidth < 700 ? 24 : 18;
      head.camera.updateProjectionMatrix();
      const faceTarget = new head.camera.position.constructor();
      head.objectHead.getWorldPosition(faceTarget);
      const portraitView = { cameraX:0, cameraY:0, cameraDistance:0.9, cameraRotateX:0, cameraRotateY:0 };
      head.setView('head', portraitView);
      const centerShift = faceTarget.x - head.controls.target.x;
      head.controls.target.x += centerShift;
      head.camera.position.x += centerShift;
      head.cameraEnd.x += centerShift;
      head.controlsEnd.x += centerShift;
      window.talkingHead = head; window.headtts = headtts;
      const controls = head.controls;
      const baseView = { ...portraitView };
      let view = { ...baseView };
      $('zoomIn').onclick = () => { view.cameraDistance=Math.max(-0.75,view.cameraDistance-0.12); head.setView('head',view); };
      $('zoomOut').onclick = () => { view.cameraDistance=Math.min(3.5,view.cameraDistance+0.12); head.setView('head',view); };
      $('panLeft').onclick = () => { view.cameraX=Math.max(-0.65,view.cameraX-0.12); head.setView('head',view); };
      $('panRight').onclick = () => { view.cameraX=Math.min(0.65,view.cameraX+0.12); head.setView('head',view); };
      $('resetCamera').onclick = () => { view={...baseView}; head.setView('head',view); const shift=faceTarget.x-head.controls.target.x; head.controls.target.x+=shift; head.camera.position.x+=shift; head.cameraEnd.x+=shift; head.controlsEnd.x+=shift; controls?.update(); };
      ready=true; el.speak.disabled=false; el.speak.textContent='Speak'; el.progress.textContent='Ready Â· type a line and press Speak'; setStatus('Ready to speak', true);
      el.inference.textContent = 'RTX inference Â· ready';
    }
    el.voice.addEventListener('change', () => { if (ready) headtts.setup({voice:el.voice.value}); });
    el.form.addEventListener('submit', (event) => { event.preventDefault(); const text=el.text.value.trim(); if (!ready || !text) return; setMood(el.emotion.value); el.speak.disabled=true; el.progress.textContent='Synthesizing locallyâ€¦'; headtts.synthesize({ input:text }).finally(() => { el.speak.disabled=false; }); });
    document.addEventListener('visibilitychange', () => { if (!head) return; document.visibilityState === 'visible' ? head.start() : head.stop(); });
    boot().catch((error) => { console.error(error); setStatus('Startup needs attention'); el.progress.textContent=`Could not start: ${error.message || error}`; el.speak.textContent='Retry'; el.speak.disabled=false; el.inference.textContent='Browser fallback available'; });
  </script>
</body>
</html>
