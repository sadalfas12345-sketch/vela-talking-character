<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09111f" />
  <title>Vela — Talking Character</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root { color-scheme: dark; --ink:#ecf3ff; --muted:#8e9bb2; --panel:rgba(11,20,37,.84); --line:rgba(167,190,224,.15); --accent:#8af1d1; --accent2:#82a9ff; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#070d18; color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; }
    body { min-height:100dvh; overflow-x:hidden; }
    #avatar { position:fixed; inset:0; z-index:0; }
    #avatar::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(5,10,20,.25) 0%, transparent 24%, transparent 57%, rgba(5,10,20,.3) 100%); }
    .shell { position:relative; z-index:2; min-height:100dvh; display:flex; flex-direction:column; padding:clamp(14px,2.5vw,30px); padding-bottom:8px; pointer-events:none; }
    #avatar { filter:contrast(1.035) saturate(1.04); }
    #avatar canvas { width:100% !important; height:100% !important; }
    header, .panel { pointer-events:auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:36px; height:36px; display:grid; place-items:center; border:1px solid rgba(138,241,209,.5); border-radius:12px; color:var(--accent); background:rgba(138,241,209,.08); font-weight:700; }
    .brand strong { font-family:'Space Grotesk'; font-size:18px; letter-spacing:.02em; }
    .brand small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .status { display:flex; align-items:center; gap:9px; font-size:12px; color:#b9c5d7; background:rgba(10,19,34,.58); border:1px solid var(--line); padding:9px 12px; border-radius:999px; backdrop-filter:blur(12px); }
    .character-switch { pointer-events:auto; position:fixed; z-index:4; top:74px; left:clamp(12px,2.5vw,30px); display:flex; gap:8px; align-items:center; }
    .character-switch select,.character-switch button { width:auto; margin:0; padding:9px 12px; border:1px solid var(--line); border-radius:11px; color:var(--ink); background:rgba(8,15,27,.84); font:inherit; font-size:12px; cursor:pointer; }
    .character-switch button { color:var(--accent); }
    .compatibility { display:none; pointer-events:auto; position:fixed; z-index:4; top:120px; left:clamp(12px,2.5vw,30px); max-width:min(440px,calc(100vw - 24px)); padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(8,15,27,.88); color:#d8e3f4; font-size:12px; line-height:1.45; }
    .compatibility[data-kind="error"] { border-color:rgba(255,132,132,.5); color:#ffd0d0; }
    .camera-tools { pointer-events:auto; position:fixed; z-index:3; right:16px; top:50%; transform:translateY(-50%); display:grid; gap:8px; }
    .camera-tools button { width:42px; height:42px; padding:0; border:1px solid var(--line); border-radius:50%; color:var(--ink); background:rgba(8,15,27,.72); box-shadow:none; backdrop-filter:blur(10px); font-size:18px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#ffbe71; box-shadow:0 0 12px #ffbe71; }
    .dot.ready { background:var(--accent); box-shadow:0 0 12px var(--accent); }
    .content { width:min(100%, 900px); margin: auto auto 0; }
    .panel { width:100%; background:rgba(8,15,27,.86); border:1px solid var(--line); border-radius:18px; padding:12px; box-shadow:0 10px 44px rgba(0,0,0,.3); backdrop-filter:blur(16px); }
    .panel-top { display:none; }
    label { display:none; }
    textarea, select { width:100%; border:1px solid var(--line); color:var(--ink); background:rgba(5,13,26,.78); border-radius:14px; padding:13px 14px; font:inherit; outline:none; }
    textarea { height:52px; min-height:52px; max-height:96px; resize:vertical; line-height:1.4; }
    textarea:focus, select:focus { border-color:rgba(138,241,209,.7); box-shadow:0 0 0 3px rgba(138,241,209,.08); }
    .row { display:grid; grid-template-columns:150px 150px 1fr; gap:8px; margin-top:8px; align-items:center; }
    .select-wrap select { appearance:none; }
    button { width:100%; margin-top:0; border:0; border-radius:12px; padding:12px 16px; color:#06131a; background:linear-gradient(135deg,var(--accent),#b1f8e5); font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 9px 24px rgba(138,241,209,.16); }
    button:disabled { opacity:.45; cursor:wait; }
    #recordClip { margin-top:8px; background:rgba(130,169,255,.17); color:#e6edff; border:1px solid rgba(130,169,255,.45); box-shadow:none; }
     .progress { margin:5px 3px 0; color:var(--muted); font-size:11px; min-height:14px; }
    @media (max-width:600px) { .shell { padding:12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); } .status { font-size:10px; padding:7px 9px; } .content { width:100%; margin:auto auto 0; } .panel { padding:10px; border-radius:16px; } textarea { height:52px; min-height:52px; } .row { grid-template-columns:1fr 1fr 100px; gap:7px; margin-top:7px; } select { padding:10px 8px; font-size:13px; border-radius:11px; } button { padding:11px 8px; font-size:13px; border-radius:11px; } .progress { margin-top:4px; } .camera-tools { right:auto; left:12px; } }
  </style>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186/examples/jsm/",
    "talkinghead": "./TalkingHead/modules/talkinghead.mjs",
    "headtts": "./HeadTTS/modules/headtts.mjs"
  } }
  </script>
</head>
<body>
  <div id="avatar" aria-label="3D talking character"></div>
  <main class="shell">
    <header>
      <div class="brand"><div class="mark">V</div><div><strong>VELA</strong><small>realtime character studio</small></div></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading avatar…</span></div>
    </header>
    <div class="character-switch">
      <select id="characterSelect" aria-label="Active character"><option value="default">Vela · default</option><option value="tripo">Tripo · portrait</option></select>
      <button type="button" id="importCharacter">Import Character</button>
      <input id="characterFile" type="file" accept=".glb,model/gltf-binary" hidden />
    </div>
    <div id="compatibility" class="compatibility" role="status" aria-live="polite"></div>
    <nav class="camera-tools" aria-label="Camera controls">
      <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
      <button type="button" id="panLeft" aria-label="Pan left" title="Pan left">←</button>
      <button type="button" id="panRight" aria-label="Pan right" title="Pan right">→</button>
      <button type="button" id="resetCamera" aria-label="Reset camera" title="Reset camera">↺</button>
    </nav>
    <section class="content">
      <form class="panel" id="talkForm">
        <div class="panel-top"><span class="panel-title">Give Vela a line</span><span class="inference" id="inferenceMode">RTX inference · connecting</span></div>
        <label for="text">Dialogue</label>
        <textarea id="text" maxlength="500">Every good idea starts as a conversation. Let’s make this one memorable.</textarea>
        <div class="row">
          <div><label for="emotion">Emotion</label><select id="emotion"><option value="neutral">Neutral</option><option value="happy">Happy</option><option value="sad">Sad</option><option value="angry">Angry</option><option value="nervous">Nervous</option></select></div>
          <div><label for="voice">Voice</label><select id="voice"><option value="af_bella">Bella · warm</option><option value="am_fenrir">Fenrir · grounded</option></select></div>
        </div>
        <button id="speak" type="submit" disabled>Loading character…</button>
         <button id="recordClip" type="button" disabled>Export 9:16 talking clip</button>
        <div id="progress" class="progress" role="status"></div>
      </form>
    </section>
  </main>
  <script type="module">
    import { TalkingHead } from "talkinghead";
    import { HeadTTS } from "headtts";
    import { VelaCreatorRecorder } from "./creator-recorder.mjs";
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { inspectCharacter, adaptCharacterGLTF, compatibilityMessage, cacheKey } from "./character-adapter.mjs";

    const $ = (id) => document.getElementById(id);
    const el = { avatar:$('avatar'), form:$('talkForm'), text:$('text'), emotion:$('emotion'), voice:$('voice'), speak:$('speak'), recordClip:$('recordClip'), progress:$('progress'), statusDot:$('statusDot'), statusText:$('statusText'), inference:$('inferenceMode'), characterFile:$('characterFile'), characterSelect:$('characterSelect'), compatibility:$('compatibility'), importCharacter:$('importCharacter') };
    let head, headtts, ready = false, moodTimer, defaultAvatar, importedCharacter = null, tripoCharacter = null, tripoBindPoseState = null, cameraHome = null, defaultRandomizedMorphs = [], defaultPoseState = null, panCamera=()=>{};
    let creatorRecorder = null, pendingRecord = false, recordWatchdog = null;
    const moods = { neutral:'neutral', happy:'happy', sad:'sad', angry:'angry', nervous:'fear' };

    function setStatus(text, isReady=false) { el.statusText.textContent=text; el.statusDot.classList.toggle('ready', isReady); }
    function showCompatibility(text, kind='info') { el.compatibility.textContent=text; el.compatibility.dataset.kind=kind; el.compatibility.style.display='block'; }
    function setMood(mood) { if (!head) return; head.setMood(moods[mood] || 'neutral'); clearTimeout(moodTimer); moodTimer=setTimeout(() => head.setMood('neutral'), 5200); }
    function clonePoseProps(props) { return Object.fromEntries(Object.entries(props||{}).map(([key,value])=>[key,value?.clone?value.clone():value])); }
    function capturePoseState(instance) {
      return { poseBase:{...instance.poseBase,props:clonePoseProps(instance.poseBase?.props)}, poseTarget:{...instance.poseTarget,props:clonePoseProps(instance.poseTarget?.props),template:instance.poseTarget?.template}, poseDelta:{...instance.poseDelta,props:clonePoseProps(instance.poseDelta?.props)}, poseName:instance.poseName, poseCurrentTemplate:instance.poseCurrentTemplate, poseStraight:clonePoseProps(instance.poseStraight) };
    }
    function restorePoseState(instance,state) {

      instance.poseTarget={...state.poseTarget,props:clonePoseProps(state.poseTarget.props),template:state.poseTarget.template};
      instance.poseDelta={...state.poseDelta,props:clonePoseProps(state.poseDelta.props)};
      instance.poseName=state.poseName;instance.poseCurrentTemplate=state.poseCurrentTemplate;instance.poseStraight=clonePoseProps(state.poseStraight);
    }

    async function boot() {
      head = new TalkingHead(el.avatar, { ttsEndpoint:'N/A', lipsyncModules:[], cameraView:'head', mixerGainSpeech:3, cameraRotateEnable:true, cameraPanEnable:true, cameraZoomEnable:true, ambientLightColor:0x9fb8d6, ambientLightIntensity:1.5, cameraY:0.02, cameraRotateX:0, cameraRotateY:0 });
      creatorRecorder = new VelaCreatorRecorder({
        renderCanvas: head.renderer.domElement,
        audioContext: head.audioCtx,
        audioOutputNode: head.audioReverbNode,
        onStatus: message => { el.progress.textContent = message; }
      });
      // Capture immediately after WebGL drawing, while the rendered pixels are
      // still available; periodic independent canvas capture can be blank.
      const renderNative = head.renderer.render.bind(head.renderer);
      head.renderer.render = (...args) => {
        const result = renderNative(...args);
        if (creatorRecorder?.active) creatorRecorder.copyFrame?.();
        return result;
      };
      const lookAheadNative=head.lookAhead.bind(head);
      head.lookAhead=(duration)=>head.avatar?.avatarDisableMoodPose?undefined:lookAheadNative(duration);
      const updateMorphTargetsNative=head.updateMorphTargets.bind(head);
      head.updateMorphTargets=(dt)=>{
        updateMorphTargetsNative(dt);
        if(!head.avatar?.avatarDisableMoodPose)return;
        for(const name of ['bodyRotateX','bodyRotateY','bodyRotateZ','headRotateX','headRotateY','headRotateZ']){
          const channel=head.mtAvatar[name];if(!channel)continue;

        }
        for(const key of ['Head.quaternion','Spine1.quaternion','Spine.quaternion','Hips.quaternion','LeftUpLeg.quaternion','RightUpLeg.quaternion','LeftLeg.quaternion','RightLeg.quaternion']){
          const delta=head.poseDelta.props[key];if(delta)delta.x=delta.y=delta.z=0;
        }
        head.animQueue=head.animQueue.filter(animation=>animation.template?.name!=='headmove');
      };
      // Supply neutral internal channels needed by TalkingHead eye/blink paths
      // when imported face meshes omit Oculus gaze/brow shapes.
      head.mtCustoms.push('eyeLookInLeft','eyeLookOutLeft','eyeLookInRight','eyeLookOutRight','eyesLookDown','eyesLookUp','eyesClosed','browDownLeft','browDownRight');
      defaultRandomizedMorphs=[...head.mtRandomized];
      const setMoodNative=head.setMood.bind(head);
      head.setMood=(name)=>{
        const mood=head.animMoods[String(name||'').trim().toLowerCase()];
        if(head.avatar?.avatarDisableMoodPose && mood){
          const scaleMovement=(value,factor)=>Array.isArray(value)?value.map(item=>scaleMovement(item,factor)):(typeof value==='number'?value*factor:value);
          const anims=mood.anims;

              const factor=name==='neutral'&&phase==='idle'?0:0.18;
              for(const channel of ['bodyRotateX','bodyRotateY','bodyRotateZ','headRotateX','headRotateY','headRotateZ'])if(softened[phase].vs[channel])softened[phase].vs[channel]=scaleMovement(softened[phase].vs[channel],factor);
            }
            return softened;
          });
          try{return setMoodNative(name);}finally{mood.anims=anims;}
        }
        return setMoodNative(name);
      };
      headtts = new HeadTTS({
        // Prefer the RTX PC's local HeadTTS REST endpoint. The browser engines remain a fallback
        // for phones or when the desktop inference service is not running.
        endpoints: [`${location.origin}/v1`, 'webgpu', 'wasm'],
        languages:['en-us'], voices:['af_bella','am_fenrir'], voiceURL:'../voices', audioCtx:head.audioCtx,
        transformersModule:'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.0/dist/transformers.min.js',
        dictionaryURL:'../dictionaries', trace:0
      });
      headtts.onmessage = (message) => {
         if (message.type === 'audio') {
           let recordingPromise = null;
           if (pendingRecord) {
             pendingRecord = false;
             clearTimeout(recordWatchdog);
             try {
               recordingPromise = creatorRecorder.start();
               recordingPromise.catch(error => {
                 el.progress.textContent = 'Export failed: ' + (error.message || error);
               }).finally(() => {
                 el.recordClip.disabled = false;
                 el.speak.disabled = false;
               });
             } catch (error) {
               el.progress.textContent = 'Recording unavailable: ' + (error.message || error);
               el.recordClip.disabled = false;
             }
           }
           try {
             head.speakMarker(() => {});
             head.speakAudio(message.data, {}, (word) => {
               if (!creatorRecorder?.active) el.progress.textContent = word || 'Speaking…';
             });
             if (recordingPromise) creatorRecorder.watchSpeech(() => head.isSpeaking);
           } catch (error) {
             if (recordingPromise) creatorRecorder.stop(false);
             el.progress.textContent = 'Speech failed: ' + (error.message || error);
             el.recordClip.disabled = false;
             el.speak.disabled = false;
           }
         } else if (message.type === 'error') {
           clearTimeout(recordWatchdog);
           pendingRecord = false;
           el.progress.textContent = 'TTS error: ' + (message.data?.error || 'unknown error');
           el.speak.disabled = false;
           el.recordClip.disabled = false;
         }
       };
       const info = { head:'', tts:'' };
      const progress = (name, ev) => { if (ev?.lengthComputable) info[name]=`${Math.round(ev.loaded/ev.total*100)}%`; else if (ev) info[name]=`${Math.round(ev.loaded/1000)} KB`; el.progress.textContent=`Loading ${info.head || 'avatar'} · ${info.tts || 'voice engine'}`; };
      defaultAvatar = { url:'./TalkingHead/avatars/avaturn.glb', body:'F', avatarMood:'neutral', lipsyncLang:'en', retarget:{ Hips:{y:0.03}, Spine:{y:0.02}, Spine1:{y:0.02,z:0.01}, Spine2:{y:0.02,z:0.01}, Neck:{z:0.02,y:0.01}, Head:{z:0.02}, LeftShoulder:{rx:-0.5}, RightShoulder:{rx:-0.5}, scaleToHipsLevel:1.0 }, baseline:{ headRotateX:-0.05, eyeBlinkLeft:0.15, eyeBlinkRight:0.15 } };
      await Promise.all([
        head.showAvatar(defaultAvatar, progress.bind(null,'head')),
        headtts.connect(null, progress.bind(null,'tts'))
      ]);
      defaultRandomizedMorphs=defaultRandomizedMorphs.filter(name=>head.mtAvatar[name]);
      head.mtRandomized=[...defaultRandomizedMorphs];
      headtts.setup({ voice:el.voice.value, language:'en-us', speed:1, audioEncoding:'wav' });
      defaultPoseState=capturePoseState(head);
      // TalkingHead defaults to a 10° portrait lens. Widen it for this avatar so
      // its eyes, cheeks and jaw remain in frame on tall phone screens.
      head.camera.fov = window.innerWidth < 700 ? 24 : 18;
      head.camera.updateProjectionMatrix();
      const faceTarget = new head.camera.position.constructor();
      head.objectHead.getWorldPosition(faceTarget);
      const portraitView = { cameraX:0, cameraY:0, cameraDistance:0.9, cameraRotateX:0, cameraRotateY:0 };
      head.setView('head', portraitView);
      const centerShift = faceTarget.x - head.controls.target.x;
      head.controls.target.x += centerShift;
      head.camera.position.x += centerShift;
      head.cameraEnd.x += centerShift;
      head.controlsEnd.x += centerShift;
      window.talkingHead = head; window.headtts = headtts;
      const controls = head.controls;
      cameraHome={ position:head.camera.position.clone(), target:controls.target.clone() };
      const zoom=(factor)=>{const offset=head.camera.position.clone().sub(controls.target);const next=Math.max(2.15,Math.min(8,offset.length()*factor));offset.setLength(next);head.camera.position.copy(controls.target).add(offset);controls.update();};
    const pan=(direction)=>{const right=new head.camera.position.constructor(1,0,0).applyQuaternion(head.camera.quaternion);const shift=right.multiplyScalar(direction*0.031);head.camera.position.add(shift);controls.target.add(shift);controls.update();};
    panCamera=pan;
      $('zoomIn').onclick = () => zoom(0.88);
      $('zoomOut').onclick = () => zoom(1.14);
      $('panLeft').onclick = () => pan(-1);
      $('panRight').onclick = () => pan(1);
      $('resetCamera').onclick = () => { if(!cameraHome)return; head.camera.position.copy(cameraHome.position); controls.target.copy(cameraHome.target); controls.update(); };
      el.importCharacter.addEventListener('click', () => el.characterFile.click());
      el.characterFile.addEventListener('change', importCharacterFile);
      el.characterSelect.addEventListener('change', async () => {
        if (el.characterSelect.value === 'default') await activateAvatar(defaultAvatar);
        else if (el.characterSelect.value === 'tripo') {
          if (tripoCharacter) await activateAvatar(tripoCharacter.avatar);
          else {
            el.importCharacter.disabled=true;
            try {
              const response=await fetch('./assets/tripo/vela-photoreal/vela-photoreal-faced.glb');
              if(!response.ok) throw new Error(`Character download failed with HTTP ${response.status}`);
              const file=new File([await response.blob()],'vela-photoreal-faced.glb',{type:'model/gltf-binary'});
              await importCharacterFile(file);
            } catch(error) {
              showCompatibility(`Could not load the built-in Tripo portrait: ${error.message || error}`, 'error');
              el.characterSelect.value='default';
            } finally { el.importCharacter.disabled=false; }
          }
        } else if (importedCharacter) await activateAvatar(importedCharacter.avatar);
      });
      ready=true; el.speak.disabled=false; el.recordClip.disabled=!VelaCreatorRecorder.isSupported(); el.speak.textContent='Speak'; el.progress.textContent='Ready · type a line and press Speak'; setStatus('Ready to speak', true);
      el.inference.textContent = 'RTX inference · ready';
    }
    async function importCharacterFile(fileOverride=null) {
      const file=fileOverride instanceof File ? fileOverride : el.characterFile.files?.[0]; if (!file) return;

      try {
        const loader=new GLTFLoader(); const gltf=await loader.parseAsync(await file.arrayBuffer(),'');
        let report=inspectCharacter(gltf); const cache=cacheKey(file);
        try {
          const cached=JSON.parse(localStorage.getItem(cache) || 'null');
          if (cached?.adapterVersion===1 && cached?.report?.morphTargets?.join('|')===report.morphTargets.join('|')) report=cached.report;
        } catch {}
        const jaw=report.bones.some(name=>['jaw','lowerjaw','mandible'].includes(name.toLowerCase()));
        const eyes=report.bones.filter(name=>/eye/i.test(name));
        const details=`${report.meshes} meshes · ${report.materials.length} materials · ${report.textures.length} textures · ${report.bones.length} bones · ${report.morphTargets.length} morph targets. Speech visemes ${report.visemes.length}/15; blink targets ${report.blinks.length}/2; expression targets ${report.expressions.length}. ${jaw?'Jaw bone detected. ':''}${eyes.length?`Eye bones detected: ${eyes.join(', ')}. `:''}`;
        if (!report.importable) {
          let remedy=compatibilityMessage(report);
          if (!report.morphMeshes) remedy += ' Required conversion: generate facial shape keys on the same face mesh, including jawOpen, both eyeBlink shapes, and Oculus/ARKit speech shapes. A jaw bone alone cannot produce accurate lip sync. Export the rigged GLB again; Vela does not synthesize missing deformations.';
          showCompatibility(`${file.name}: ${details} Not activated. ${remedy}`, 'error');
          return;
        }
        const url=URL.createObjectURL(file);
        const isTripoPortrait=/^(?:vela-photoreal-(?:faced|facefit-prototype)|vela-face-(?:surfacefit|fullprojection)-prototype|vela-fullhead-expanded-prototype)\.glb$/i.test(file.name);
        let adapterOptions={};
        if (isTripoPortrait) {
          const calibration=await fetch('./assets/tripo/vela-photoreal/face-calibration.json').then(response=>{
            if(!response.ok) throw new Error('Tripo facial landmark calibration is missing');
            return response.json();
          });
          adapterOptions={eyeLandmarks3d:calibration.landmarks3d,diagnosticLandmarks3d:calibration.landmarks3d,sourceRootLift:calibration.sourceRootLiftMeters,faceForwardYawRadians:calibration.faceForwardYawRadians};
        }
        const avatar={ url, body:'F', avatarMood:'neutral', lipsyncLang:'en', retarget:{ scaleToHipsLevel:1 }, baseline:{ headRotateX:0 } };
        if(Number.isFinite(adapterOptions.faceForwardYawRadians)) Object.assign(avatar,{avatarIgnoreCamera:true,avatarIdleEyeContact:false,avatarSpeakingEyeContact:false,avatarIdleHeadMove:0,avatarSpeakingHeadMove:0,avatarDisableMoodPose:true});
        avatar.preprocess=(sceneGltf)=>{
          if(isTripoPortrait){
            tripoBindPoseState={};
            const objects=[];sceneGltf.scene.traverse(object=>objects.push(object));
            for(const key of head.posePropNames){
              const [boneName,property]=key.split('.');
              const object=objects.find(item=>item.isBone&&item.name.replace(/^mixamorig[:_]?/i,'')===boneName);
              if(object?.[property]?.clone)tripoBindPoseState[key]=object[property].clone();
            }
          }
          adaptCharacterGLTF(sceneGltf,report,adapterOptions);
        };
        avatar.compatibility=report;
        const character={ name:file.name, url, avatar, report, cache };
        if (isTripoPortrait) tripoCharacter=character; else importedCharacter=character;
        try { localStorage.setItem(cache,JSON.stringify({ adapterVersion:1, name:file.name, report, avatarConfig:{ body:'F', avatarMood:'neutral', lipsyncLang:'en', retarget:avatar.retarget }, checkedAt:Date.now() })); } catch {}
        if (!isTripoPortrait && !el.characterSelect.querySelector('option[value="imported"]')) {
          const option=document.createElement('option'); option.value='imported'; option.textContent=file.name; el.characterSelect.append(option);
        }
        el.characterSelect.value=isTripoPortrait?'tripo':'imported';
        const activated=await activateAvatar(avatar);
        if(!activated){showCompatibility(`${file.name}: inspected, but activation failed. ${compatibilityMessage(report)}`, 'error');return;}
        showCompatibility(`${file.name}: ${details} ${compatibilityMessage(report)}`, report.hasBothBlinks && report.missingVisemes.length===0 ? 'ok':'info');
      } catch(error) {
        showCompatibility(`Could not import ${file.name}: ${error.message || error}. Confirm this is a valid, uncompressed or supported GLB file. The current character remains active.`, 'error');
      } finally { el.importCharacter.disabled=false; el.characterFile.value=''; }
    }
    async function activateAvatar(avatar) {
      el.speak.disabled=true; el.progress.textContent='Loading character…';
      try {
        const { compatibility, preprocess, ...headAvatar }=avatar;
        const isConvertedTripo=Boolean(avatar.avatarDisableMoodPose);
        if(!isConvertedTripo&&defaultPoseState)restorePoseState(head,defaultPoseState);
        await head.showAvatar(headAvatar, null, preprocess);
        if(isConvertedTripo){
          const skeletons=new Set();head.armature.traverse(object=>{if(object.isSkinnedMesh&&object.skeleton)skeletons.add(object.skeleton);});
          for(const skeleton of skeletons)skeleton.pose();
          // TalkingHead reuses its last poseTarget and poseBase when showAvatar
          // changes models. Rebase every animation property to this GLB's true
          // bind pose so stale Avaturn rotations cannot be written back next frame.
          head.scene.updateMatrixWorld(true);
          for(const key of head.posePropNames){
            const value=tripoBindPoseState?.[key]||head.poseAvatar?.props?.[key];
            if(!value)continue;
            head.poseAvatar.props[key].copy(value);
            const base=head.poseBase.props[key]||value.clone();
            base.copy(value); base.t=head.animClock; base.d=0; head.poseBase.props[key]=base;
            const target=head.poseTarget.props[key]||value.clone();
            target.copy(value); target.t=head.animClock; target.d=0; head.poseTarget.props[key]=target;
          }
          const neutralTemplateProps={};
          for(const key of head.posePropNames){
            const [boneName,property]=key.split('.'),value=head.poseAvatar?.props?.[key];if(!value)continue;
            if(value.isQuaternion){const euler=new THREE.Euler().setFromQuaternion(value,'XYZ');neutralTemplateProps[`${boneName}.rotation`]={x:euler.x,y:euler.y,z:euler.z};}
            else if(value.isVector3)neutralTemplateProps[key]={x:value.x,y:value.y,z:value.z};
          }
          head.poseTarget.template={standing:true,props:neutralTemplateProps};
          head.poseCurrentTemplate=head.poseTarget.template;
          head.poseName='tripo-bind';
          for(const delta of Object.values(head.poseDelta.props)){delta.x=0;delta.y=0;delta.z=0;}
          for(const name of ['bodyRotateX','bodyRotateY','bodyRotateZ','headRotateX','headRotateY','headRotateZ']){
            const channel=head.mtAvatar[name];if(!channel)continue;
            Object.assign(channel,{system:null,systemd:null,realtime:null,fixed:null,base:null,newvalue:null,v:0,value:0,applied:0,needsUpdate:true});
          }
          head.animQueue=head.animQueue.filter(animation=>!['headmove','pose'].includes(animation.template?.name));
          head.armature.updateMatrixWorld(true);
        }
        head.mtRandomized=isConvertedTripo?defaultRandomizedMorphs.filter(name=>head.mtAvatar[name]):[...defaultRandomizedMorphs];
        head.camera.fov=window.innerWidth<700?(isConvertedTripo?15.5:24):(isConvertedTripo?14:18); head.camera.updateProjectionMatrix();
        head.setView('head',{ cameraY:0.02, cameraDistance:0.9 });
        if(!isConvertedTripo)await new Promise(resolve=>setTimeout(resolve,1050));
        const headPoint=new head.camera.position.constructor();
        const tripoLeft=head.armature?.getObjectByName('VelaLandmark_eye_outer_left');
        const tripoRight=head.armature?.getObjectByName('VelaLandmark_eye_outer_right');
        if(isConvertedTripo&&tripoLeft&&tripoRight){
          const point=(name)=>head.armature.getObjectByName(`VelaLandmark_${name}`)?.getWorldPosition(new head.camera.position.constructor());
          const eyeLeft=point('eye_top_left').add(point('eye_bottom_left')).multiplyScalar(0.5);
          const eyeRight=point('eye_top_right').add(point('eye_bottom_right')).multiplyScalar(0.5);
          const brow=point('brow_left').add(point('brow_right')).multiplyScalar(0.5);
          const chin=point('chin');
          const upperLip=point('upper_lip'), lowerLip=point('lower_lip');
          const faceUp=brow.clone().sub(chin).normalize();
          const eyeLine=eyeRight.clone().sub(eyeLeft).normalize();
          const faceForward=faceUp.clone().cross(eyeLine).normalize();
          const faceCenter=eyeLeft.clone().add(eyeRight).add(brow).add(chin).add(upperLip).add(lowerLip).multiplyScalar(1/6);
          const previousView=head.camera.position.clone().sub(faceCenter).normalize();
          if(faceForward.dot(previousView)<0)faceForward.negate();
          const distance=head.cameraEnd.distanceTo(head.controlsEnd)||head.camera.position.distanceTo(head.controls.target);
          headPoint.copy(faceCenter);
          head.controls.target.copy(faceCenter);
          head.camera.position.copy(faceCenter).addScaledVector(faceForward,distance);
          head.camera.up.set(0,1,0);
          head.camera.lookAt(faceCenter);
          head.camera.updateMatrixWorld(true);
          head.controls.update();
        }else if(head.objectLeftEye&&head.objectRightEye){
          const left=head.objectLeftEye.getWorldPosition(new head.camera.position.constructor());
          const right=head.objectRightEye.getWorldPosition(new head.camera.position.constructor());
          headPoint.copy(left).add(right).multiplyScalar(0.5);
        }else head.objectHead.getWorldPosition(headPoint);
        const shift=headPoint.clone().sub(head.controls.target); head.controls.target.add(shift); head.camera.position.add(shift); head.controls.update();
        if(isConvertedTripo)panCamera(1);
        head.cameraEnd.copy(head.camera.position); head.controlsEnd.copy(head.controls.target);
        cameraHome={position:head.camera.position.clone(),target:head.controls.target.clone()};
        el.progress.textContent='Character ready · type a line and press Speak';
        return true;
      } catch(error) {
        console.error(error); showCompatibility(`Character could not be activated: ${error.message || error}. The previous character remains active if it is still visible.`, 'error');
        if (el.characterSelect.value==='imported' || el.characterSelect.value==='tripo') el.characterSelect.value='default';
        el.progress.textContent='Character load failed';
        return false;
      } finally { el.speak.disabled=!ready || pendingRecord || Boolean(creatorRecorder?.active); el.recordClip.disabled=!ready || pendingRecord || Boolean(creatorRecorder?.active) || !VelaCreatorRecorder.isSupported(); }
    }
    el.voice.addEventListener('change', () => { if (ready) headtts.setup({voice:el.voice.value}); });
    el.form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = el.text.value.trim();
      if (!ready || !text || pendingRecord || creatorRecorder?.active) return;
      setMood(el.emotion.value);
      el.speak.disabled = true;
      el.progress.textContent = 'Synthesizing locally…';
      headtts.synthesize({ input:text }).catch(error => {
        el.progress.textContent = 'TTS error: ' + (error.message || error);
      }).finally(() => {
        if (!pendingRecord && !creatorRecorder?.active) el.speak.disabled = false;
      });
    });
    el.recordClip.addEventListener('click', () => {
      const text = el.text.value.trim();
      if (!ready || !text || pendingRecord || creatorRecorder?.active) return;
      if (head.isSpeaking) {
        el.progress.textContent = 'Finish the current speech before exporting.';
        return;
      }
      pendingRecord = true;
      el.speak.disabled = true;
      el.recordClip.disabled = true;
      setMood(el.emotion.value);
      el.progress.textContent = 'Synthesizing audio for portrait export…';
      recordWatchdog = setTimeout(() => {
        if (!pendingRecord) return;
        pendingRecord = false;
        el.speak.disabled = false;
        el.recordClip.disabled = false;
        el.progress.textContent = 'Recording timed out waiting for synthesized audio.';
      }, 30_000);
      headtts.synthesize({ input:text }).catch(error => {
        clearTimeout(recordWatchdog);
        pendingRecord = false;
        el.speak.disabled = false;
        el.recordClip.disabled = false;
        el.progress.textContent = 'TTS error: ' + (error.message || error);
      });
    });
    document.addEventListener('visibilitychange', () => { if (!head) return; document.visibilityState === 'visible' ? head.start() : head.stop(); });
    window.addEventListener('resize',()=>{if(!head?.camera)return;const tripo=head.avatar?.avatarDisableMoodPose;head.camera.fov=window.innerWidth<700?(tripo?15.5:24):(tripo?14:18);head.camera.updateProjectionMatrix();});
    boot().catch((error) => { console.error(error); setStatus('Startup needs attention'); el.progress.textContent=`Could not start: ${error.message || error}`; el.speak.textContent='Retry'; el.speak.disabled=false; el.inference.textContent='Browser fallback available'; });
  </script>
</body>
</html>
